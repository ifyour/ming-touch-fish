name = "news-aggregator-fetcher"
main = "src/index.ts"
compatibility_date = "2026-06-29"
compatibility_flags = ["nodejs_compat"]

# Cron trigger: every hour at minute 0
triggers = { crons = ["0 * * * *"] }

[[queues.consumers]]
queue = "news-fetch-queue"
max_batch_size = 10
max_retries = 3

[[queues.producers]]
binding = "NEWS_QUEUE"
queue = "news-fetch-queue"

[[d1_databases]]
binding = "DB"
database_name = "news-aggregator"
database_id = "c4d7b287-e336-432c-bd93-930a03af7be9"
preview_database_id = "c4d7b287-e336-432c-bd93-930a03af7be9"
migrations_dir = "../../packages/db/migrations"

[ai]
binding = "AI"

[observability]
enabled = true
head_sampling_rate = 1
